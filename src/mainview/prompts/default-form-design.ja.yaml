# フォームデザイン定義

説明: ユーザー情報を検索・登録するための画面
フォームレイアウト:
  - パターン: 検索一覧画面   # 検索一覧画面 / 登録フォーム画面 / ダイアログ
  - カラム数: 2               # 1 / 2 / 3
  - ラベル位置: 左            # 左 / 上
  - ボタン位置: 右下          # 右下 / 右 / 下部中央

#参照テーブル: 
#  - users

入力項目: 
  - 検索ワード: inputtype で text
  - 権限フィルター: selectBox
    - 一般ユーザー: user
    - 管理者: admin
  - 一覧表示: datagrid

アクション項目: 
  - 検索ボタン
  - クリアボタン
