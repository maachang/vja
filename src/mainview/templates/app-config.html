<!--
    templates/app-config.html
    vja-app-config.js のモーダル群（アプリイベント/プロジェクト情報/拡張ランタイム/
    カラム編集/項目編集/フォント設定等）用テンプレート定義。
    詳細は templates/pinput.html のAIメモを参照。
-->
<script type="text/vja-tpl" id="ac-tpl-appev-tab">
<div class="yaml-tab <%= active %>" id="appev-tab-<%= key %>"><%= label %></div>
</script>

<script type="text/vja-tpl" id="ac-tpl-appev-hdr">
<div class="mhdr" style="flex-shrink:0">
<div style="display:flex;align-items:center;gap:0;flex:1">
<h4 style="margin:0 12px 0 0">⚡ アプリイベント</h4>
<div class="yaml-tab-bar" style="border-bottom:none;flex:1"><%- evTabs %></div>
</div>
<button class="mclose" <%- attrClose %>>✕</button>
</div>
</script>

<script type="text/vja-tpl" id="ac-tpl-ai-bar">
<button class="yaml-ai-btn" <%- attr %>>🤖 AI向け説明を生成</button>
</script>

<script type="text/vja-tpl" id="ac-tpl-coldef-row">
<tr>
<td><%= no %></td>
<td><input type="text" value="<%= label %>" <%- attrLabel %> placeholder="カラム名"></td>
<td><input type="text" value="<%= displayName %>" <%- attrDisplayName %> placeholder="表示名（省略可）"></td>
<td><input type="number" value="<%= width %>" <%- attrWidth %> style="width:70px" min="1" max="100"></td>
<td style="white-space:nowrap">
<button class="del-btn" <%- attrInsert %> title="この行の前に挿入" style="margin-right:2px">＋</button>
<button class="del-btn" <%- attrDel %> title="削除">✕</button>
</td></tr>
</script>

<script type="text/vja-tpl" id="ac-tpl-coldef-extra">
<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
<label style="font-size:12px;color:var(--text2);white-space:nowrap">最大表示件数（0=無制限）:</label>
<input type="number" id="coldef-maxrows" value="<%= maxRows %>" min="0" class="pv-input" style="width:80px">
</div>
</script>

<script type="text/vja-tpl" id="ac-tpl-itemsdef-row">
<tr>
<td><%= no %></td>
<td><input type="text" class="pv-input" value="<%= label %>" <%- attrLabel %> placeholder="表示名"></td>
<td><input type="text" class="pv-input" value="<%= value %>" <%- attrValue %> placeholder="Value（省略可）"></td>
<td style="white-space:nowrap">
<button class="del-btn" <%- attrInsert %> title="この行の前に挿入" style="margin-right:2px">＋</button>
<button class="del-btn" <%- attrDel %> title="削除">✕</button>
</td></tr>
</script>

<script type="text/vja-tpl" id="ac-tpl-font-config">
<div class="mbody" style="gap:14px">
<div style="font-size:var(--ui-font-size);font-weight:bold;color:var(--accent);padding-bottom:4px;border-bottom:1px solid var(--border)">UI全体フォント設定</div>
<div class="ai-cfg-row"><label>フォントサイズ</label>
<div style="display:flex;align-items:center;gap:8px">
<input id="uf-size" type="number" value="<%= curUiSize %>" min="10" max="20" step="1"
style="width:70px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:var(--ui-font-size);padding:0 8px;outline:none;text-align:center">
<button <%- attrUfUp %> style="width:28px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:var(--ui-font-size);cursor:pointer">▲</button>
<button <%- attrUfDown %> style="width:28px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:var(--ui-font-size);cursor:pointer">▼</button>
<span style="color:var(--text2);font-size:var(--ui-font-size)">px (10〜20)</span>
</div></div>
<div class="ai-cfg-row"><label>フォント</label>
<%- ufFontSel %>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label style="font-size:var(--ui-font-size);color:var(--text2)">UIプレビュー</label>
<div id="uf-preview" style="background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px;font-size:<%= curUiSize %>px;font-family:<%= curUiFont %>;line-height:1.8;color:var(--text)">
保存　キャンセル　閉じる　プロパティ　フォント設定　表示
</div></div>
<div style="font-size:var(--ui-font-size);font-weight:bold;color:var(--accent);padding-bottom:4px;border-bottom:1px solid var(--border);margin-top:6px">エディタフォント設定</div>
<div class="ai-cfg-row"><label>フォントサイズ</label>
<div style="display:flex;align-items:center;gap:8px">
<input id="ef-size" type="number" value="<%= curSize %>" min="10" max="32" step="1"
style="width:70px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:var(--ui-font-size);padding:0 8px;outline:none;text-align:center">
<button <%- attrEfUp %> style="width:28px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:var(--ui-font-size);cursor:pointer">▲</button>
<button <%- attrEfDown %> style="width:28px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:var(--ui-font-size);cursor:pointer">▼</button>
<span style="color:var(--text2);font-size:var(--ui-font-size)">px (10〜32)</span>
</div></div>
<div class="ai-cfg-row"><label>フォント</label>
<%- efFontSel %>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label style="font-size:var(--ui-font-size);color:var(--text2)">エディタプレビュー</label>
<div id="ef-preview" style="background:#1e1e2e;border:1px solid var(--border);border-radius:4px;padding:12px;font-size:<%= curSize %>px;font-family:<%= curFont %>;line-height:1.6;color:#e8e8f0;white-space:pre"><span style="color:#7ec8ff">function</span> <span style="color:#ffe080">hello</span>() {
  <span style="color:#7ec8ff">const</span> msg = <span style="color:#f0a87a">&quot;Hello, VJA!&quot;</span>;
  <span style="color:#7ec8ff">return</span> msg;
}</div></div>
<div class="mfoot">
<%- footBtns %>
<button class="pri" id="ef-save-btn">保存</button>
</div>
</div>
</script>

<script type="text/vja-tpl" id="ac-tpl-project-info">
<div class="mbody" style="gap:10px">
<div class="ai-cfg-row"><label>プロジェクト名</label>
<input id="pi-name" class="pv-input" style="height:28px;font-size:13px" value="<%= name %>" placeholder="マイプロジェクト">
</div>
<div class="ai-cfg-row"><label>説明</label>
<textarea id="pi-desc" class="pv-textarea" style="height:60px;font-size:13px"><%= description %></textarea>
</div>
<div class="ai-cfg-row"><label>バージョン</label>
<div style="display:flex;align-items:center;gap:4px;flex:1">
<input id="pi-ver" class="pv-input" style="height:28px;font-size:13px;flex:1" value="<%= version %>" placeholder="1.0.0">
<button <%- attrVerUp %> style="width:24px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;color:var(--text);cursor:pointer;font-size:11px;flex-shrink:0">▲</button>
<button <%- attrVerDown %> style="width:24px;height:28px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;color:var(--text);cursor:pointer;font-size:11px;flex-shrink:0">▼</button>
</div>
</div>
<div class="ai-cfg-row"><label>作成者</label>
<input id="pi-author" class="pv-input" style="height:28px;font-size:13px" value="<%= author %>" placeholder="作成者名">
</div>
<div class="ai-cfg-row"><label>会社名</label>
<input id="pi-company" class="pv-input" style="height:28px;font-size:13px" value="<%= company %>" placeholder="会社・組織名">
</div>
</div>
<div class="mfoot">
<button <%- attrCancel %>>キャンセル</button>
<button class="pri" id="pi-save-btn">保存</button>
</div>
</script>
