<!--
    templates/cloud-modal.html
    vja-app-config.js のクラウドインフラ設定モーダル用テンプレート定義。
    詳細は templates/pinput.html のAIメモを参照。
-->
<script type="text/vja-tpl" id="cm-tpl-sel-opt">
<div class="pv-sel-opt <%= active %>" <%- attr %>><%- label %></div>
</script>

<script type="text/vja-tpl" id="cm-tpl-url-readonly">
<input class="pv-input" style="flex:1;min-width:160px;color:var(--text3)" readonly value="<%= val %>" title="サービス選択で自動入力されます">
</script>

<script type="text/vja-tpl" id="cm-tpl-url-prefixed">
<div style="display:flex;align-items:center;flex:1;min-width:160px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;overflow:hidden">
    <span style="padding:0 4px;font-size:11px;color:var(--text3);white-space:nowrap;border-right:1px solid var(--border)"><%= baseUrl %></span>
    <input class="pv-input" style="flex:1;min-width:80px" placeholder="続きを入力" value="<%= editVal %>" <%- attr %>>
</div>
</script>

<script type="text/vja-tpl" id="cm-tpl-url-plain">
<input class="pv-input" style="flex:1;min-width:160px" placeholder="SDK URL を入力" value="<%= val %>" <%- attr %>>
</script>

<script type="text/vja-tpl" id="cm-tpl-cred-json">
<div style="margin-top:6px">
    <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Credentials (JSON形式: {"key":"value",...})</div>
    <textarea class="pv-input pv-textarea" style="height:60px;resize:vertical" placeholder='{"accessKeyId":"xxx","secretAccessKey":"yyy"}' <%- attr %>><%= jsonVal %></textarea>
</div>
</script>

<script type="text/vja-tpl" id="cm-tpl-cred-select">
<div class="pv-sel" id="<%= selId %>" style="flex:1">
    <div class="pv-sel-btn" <%- attrOpen %>>
        <span><%- selDispName %></span><span class="arr">▼</span>
    </div>
    <div class="pv-sel-list"><%- opts %></div>
</div>
</script>

<script type="text/vja-tpl" id="cm-tpl-cred-input">
<input type="<%= type %>" class="pv-input" style="flex:1;<%= opacity %>" placeholder="<%= placeholder %>" value="<%= val %>" <%= disabled %> <%- attr %>>
</script>

<script type="text/vja-tpl" id="cm-tpl-cred-row">
<div style="display:flex;align-items:center;gap:6px;margin-top:4px">
    <span style="width:110px;font-size:11px;color:var(--text3);flex-shrink:0"><%= k %><%= lockIcon %></span>
    <%- inputHtml %>
    <label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text3);white-space:nowrap;cursor:pointer" title="チェックON: アプリ実行時にウィジェットから入力&#10;チェックOFF: ここで設定した値を使用">
        <input type="checkbox" <%= checked %> <%- attrChange %>>アプリ側入力
    </label>
</div>
</script>

<script type="text/vja-tpl" id="cm-tpl-enabled-label">
<span style="font-size:11px;color:<%= color %>"><%= label %></span>
</script>

<script type="text/vja-tpl" id="cm-tpl-row">
<div style="padding:10px;border:1px solid var(--border);border-radius:4px">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:3px;cursor:pointer" title="ONにすると対象項目が有効になります">
            <input type="checkbox" <%= enabledChecked %> <%- attrEnabled %>>
            <%- enabledLabel %>
        </label>
        <div class="pv-sel" id="<%= csid %>" style="width:100px;flex-shrink:0">
            <div class="pv-sel-btn" <%- attrCsOpen %>>
                <span><%= cloudName %></span><span class="arr">▼</span>
            </div>
            <div class="pv-sel-list"><%- cloudOpts %></div>
        </div>
        <div class="pv-sel" id="<%= ssid %>" style="width:110px;flex-shrink:0">
            <div class="pv-sel-btn" <%- attrSsOpen %>>
                <span><%= curSvc %></span><span class="arr">▼</span>
            </div>
            <div class="pv-sel-list"><%- svcOpts %></div>
        </div>
        <%- urlField %>
        <button style="color:#ff6b6b;background:none;border:none;cursor:pointer;font-size:16px;flex-shrink:0" <%- attrRemove %>>✕</button>
    </div>
    <% if (credFields) { %>
    <div style="margin-top:6px"><%- credFields %></div>
    <% } %>
</div>
</script>

<script type="text/vja-tpl" id="cm-tpl-body">
<div class="mbody" style="gap:10px;overflow-y:auto;max-height:60vh">
    <div class="infobox">同一クラウドを複数登録した場合、先頭のCredentialが優先されます。</div>
    <div id="cloud-list" style="display:flex;flex-direction:column;gap:8px"><%- rows %></div>
    <button class="modal-btn" style="margin-top:4px" <%- attrAdd %>>＋ 追加</button>
</div>
</script>
