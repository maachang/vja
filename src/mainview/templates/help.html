<script type="text/vja-tpl" id="hp-tpl-item">
<div style="padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border); <%- style %>" <%- attrOpen %>><%= title %></div>
</script>

<script type="text/vja-tpl" id="hp-tpl-body">
<div class="mbody" style="display:flex; flex-direction:row; flex:1; min-height:0; padding:0;">
<div id="help-list" style="width:240px; flex-shrink:0; overflow-y:auto; border-right:1px solid var(--border); background:var(--bg);"><%- itemsHtml %></div>
<div style="flex:1; min-width:0; display:flex; flex-direction:column;">
<div style="display:flex; gap:8px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--border);">
<input id="help-q" class="pv-input" type="text" placeholder="わからないことをAIに質問できます（例: S3にファイルを保存するには？）" style="flex:1; min-width:0;">
<button id="help-ask-btn" class="yaml-ai-btn" <%- attrAsk %>>🤖 質問する</button>
</div>
<div id="help-content" class="help-md" style="flex:1; min-width:0; overflow-y:auto; padding:16px 24px; font-size:13px; line-height:1.7;"></div>
</div>
</div>
</script>

<script type="text/vja-tpl" id="hp-tpl-running">
<div style="display:flex; flex-direction:column; align-items:center; gap:14px; padding:40px 24px; text-align:center;">
<div style="font-size:32px; animation:spin 1s linear infinite;">⏳</div>
<div id="help-run-title" style="font-size:16px; font-weight:bold; color:var(--text);">🤖 AIがヘルプを調べています</div>
<div style="font-size:12px; color:var(--text2); max-width:420px; word-break:break-all;">質問: <%= question %></div>
<div style="width:320px; max-width:100%; height:10px; background:var(--bg3); border:1px solid var(--border); border-radius:5px; overflow:hidden;"><div id="help-run-bar" style="width:0%; height:100%; background:var(--accent); transition:width 0.2s;"></div></div>
<div id="help-run-count" style="font-size:13px; color:var(--text);"></div>
<div id="help-run-now" style="font-size:12px; color:var(--text2);"></div>
<div id="help-run-timer" style="color:var(--accent); font-size:18px; font-weight:bold;">0秒</div>
</div>
</script>

<script type="text/vja-tpl" id="hp-tpl-answer">
<div style="font-size:12px; color:var(--text2, #888); margin-bottom:8px;">🤖 質問: <%= question %></div>
<div><%- answerHtml %></div>
<div style="margin-top:16px; padding-top:8px; border-top:1px solid var(--border); font-size:12px; color:var(--text2);">📖 出典（クリックで開く）:</div>
<div style="margin-top:6px;"><%- srcHtml %></div>
<%- relatedHtml %>
</script>

<script type="text/vja-tpl" id="hp-tpl-related">
<div style="margin-top:12px; font-size:12px; color:var(--text2);">🔎 他にも関連するかもしれないページ:</div>
<div style="margin-top:6px;"><%- linksHtml %></div>
</script>

<script type="text/vja-tpl" id="hp-tpl-back">
<div style="margin-bottom:12px;"><a href="#" class="help-src" <%- attrBack %>>← 検索結果に戻る</a></div>
</script>

<script type="text/vja-tpl" id="hp-tpl-src">
<a href="#" class="help-src" <%- attrOpen %>>📖 <%= title %></a>
</script>

<script type="text/vja-tpl" id="hp-tpl-notfound">
<div style="font-size:12px; color:var(--text2, #888); margin-bottom:8px;">🤖 質問: <%= question %></div>
<p>ドキュメントに見つかりませんでした。言い換えて質問するか、左の目次から探してください。</p>
</script>

<script type="text/vja-tpl" id="hp-tpl-error">
<div style="font-size:12px; color:var(--text2, #888); margin-bottom:8px;">🤖 質問: <%= question %></div>
<p>AIへの問い合わせに失敗しました: <%= message %></p>
<p>AI設定（エンドポイント・接続先のサーバー）を確認してください。</p>
</script>
