<script type="text/vja-tpl" id="im-tpl-modal">
<div id="image-modal">
<%- header %>
<div class="mbody" style="gap:6px">
<div class="infobox"><%= infoText %></div>
<div class="image-scroll">
<table class="image-table">
<thead><tr><th style="width:64px">画像</th><th>名前</th><th style="width:70px">サイズ</th><th style="width:30px"></th></tr></thead>
<tbody><%- tbody %></tbody>
</table>
</div>
<button class="add-row-btn" <%- attrAdd %>>＋ 画像を追加</button>
</div>
<div class="mfoot"><%- footBtns %><button class="pri" <%- attrSave %>>保存</button></div>
</div>
</script>

<script type="text/vja-tpl" id="im-tpl-row">
<tr>
<td><div class="image-thumb"><img src="<%= data %>"></div></td>
<td><input type="text" value="<%= name %>" <%- attrName %> placeholder="画像名"></td>
<td class="image-size"><%= size %></td>
<td><button class="del-btn" <%- attrDel %> title="削除">✕</button></td>
</tr>
</script>

<script type="text/vja-tpl" id="im-tpl-empty">
<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:14px">画像がありません。「＋ 画像を追加」から登録してください。</td></tr>
</script>

<script type="text/vja-tpl" id="im-tpl-picker">
<div id="image-picker">
<%- header %>
<div class="mbody" style="gap:6px">
<input type="text" class="image-pick-filter" placeholder="🔍 画像名で絞り込み..." <%- attrFilter %>>
<div class="image-pick-grid" id="image-pick-grid"><%- grid %></div>
</div>
<div class="mfoot"><%- footBtns %></div>
</div>
</script>

<script type="text/vja-tpl" id="im-tpl-pick-item">
<div class="image-pick-item <%= sel %>" <%- attr %> title="<%= name %>"><div class="image-pick-thumb"><% if (data) { %><img src="<%= data %>"><% } else { %><span><%= name %></span><% } %></div><div class="image-pick-name"><%= name %></div></div>
</script>
