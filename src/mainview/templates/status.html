<!--
    templates/status.html
    vja-designer.js のツールボックス・ステータスバー表示用テンプレート定義。
    詳細は templates/pinput.html のAIメモを参照。
-->
<script type="text/vja-tpl" id="st-tpl-tool-item">
<span class="ti"><%= icon %></span><span><%= label %></span>
</script>

<script type="text/vja-tpl" id="st-tpl-tool-label">
<b><%= label %></b>
</script>

<script type="text/vja-tpl" id="st-tpl-xy">
X:<b><%= x %></b> Y:<b><%= y %></b>
</script>

<script type="text/vja-tpl" id="st-tpl-wh">
W:<b><%= w %></b> H:<b><%= h %></b>
</script>

<script type="text/vja-tpl" id="st-tpl-grid">
グリッド: <b style="color:<%= color %>"><%= label %></b>
</script>

<script type="text/vja-tpl" id="st-tpl-snap">
スナップ: <b style="color:<%= color %>"><%= label %></b>
</script>

<script type="text/vja-tpl" id="st-tpl-cnt">
ウィジェット: <b><%= count %></b>
</script>
