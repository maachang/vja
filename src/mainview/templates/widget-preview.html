<!--
    templates/widget-preview.html
    vja-defs.js の WIDGET_DEFS[tag].preview（デザイナー画面上のウィジェットプレビュー描画）用テンプレート定義。
    詳細は templates/pinput.html のAIメモを参照。

    AIメモ（重要）:
    - style属性の中に埋め込む値（色コード・フォント名・border文字列・base/vis等のCSS断片）は
      必ず <%- %>（生出力）を使うこと。escapeHtml()は ' も &#39; にエスケープするため、
      fontFamilyの値（例: 'Yu Gothic UI','Meiryo UI',sans-serif のような複数フォント指定）を
      自動エスケープすると ' が壊れてCSSとして機能しなくなる。
    - 要素のテキストコンテンツ・value/placeholder等のユーザー入力由来の値は <%= %>（自動エスケープ）を使うこと。
-->
<script type="text/vja-tpl" id="wp-tpl-button">
<button style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;border:<%- border %>;border-radius:<%- borderRadius %>px;cursor:default;pointer-events:none;<%- vis %>"><%= text %></button>
</script>

<script type="text/vja-tpl" id="wp-tpl-label">
<div style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;text-align:<%- align %>;display:flex;align-items:center;overflow:hidden;padding:0 2px;<%- vis %>"><%= text %></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-input-preview-only">
<div style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;border:<%- border %>;display:flex;align-items:center;padding:0 6px;gap:6px;pointer-events:none;<%- vis %>"><span style="font-size:11px;opacity:.7"><%= icon %></span></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-input">
<input type="<%= itype %>" value="<%= text %>" placeholder="<%= placeholder %>" <%- maxlen %> style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;border:<%- border %>;padding:0 4px;pointer-events:none;<%- vis %>">
</script>

<script type="text/vja-tpl" id="wp-tpl-checkbox">
<label style="<%- base %>display:flex;align-items:center;gap:4px;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;pointer-events:none;<%- vis %>"><input type="checkbox" <%= checked %>><%= text %></label>
</script>

<script type="text/vja-tpl" id="wp-tpl-radio">
<label style="<%- base %>display:flex;align-items:center;gap:4px;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;pointer-events:none;<%- vis %>"><input type="radio" name="<%= group %>" <%= checked %>><%= text %></label>
</script>

<script type="text/vja-tpl" id="wp-tpl-option">
<option value="<%= val %>"><%= label %></option>
</script>

<script type="text/vja-tpl" id="wp-tpl-select">
<select style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;border:<%- border %>;pointer-events:none;<%- vis %>"><%- options %></select>
</script>

<script type="text/vja-tpl" id="wp-tpl-select-multiple">
<select multiple style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;border:<%- border %>;pointer-events:none;<%- vis %>"><%- options %></select>
</script>

<script type="text/vja-tpl" id="wp-tpl-datagrid-th">
<th style="width:<%= width %>%;padding:3px 6px;border:1px solid <%- bc %>;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;<%- fontStyle %>"><%= label %></th>
</script>

<script type="text/vja-tpl" id="wp-tpl-datagrid-td">
<td style="padding:2px 6px;border:1px solid <%- bc %>;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;<%- fontStyle %>"><%= text %></td>
</script>

<script type="text/vja-tpl" id="wp-tpl-datagrid-tr">
<tr style="background:<%- bg %>;color:<%- fg %>"><%- cells %></tr>
</script>

<script type="text/vja-tpl" id="wp-tpl-datagrid">
<div style="width:100%;height:100%;overflow:auto;border:1px solid <%- bc %>;box-sizing:border-box;font-size:<%- fontSize %>px;<%- fontStyle %><%- vis %>">
<table style="width:100%;border-collapse:collapse;table-layout:fixed">
<thead><tr style="background:<%- headerBg %>;color:<%- headerFg %>"><%- headerCells %></tr></thead>
<tbody><%- rows %></tbody>
</table></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-progressbar">
<div style="<%- base %>background:<%- bg %>;border:<%- border %>;border-radius:3px;overflow:hidden;<%- vis %>"><div style="width:<%- pval %>%;height:100%;background:<%- fg %>;transition:width 0.2s;border-radius:3px"></div></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-groupbox">
<fieldset style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;border:<%- border %>;<%- vis %>"><legend style="padding:0 4px;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>"><%= text %></legend></fieldset>
</script>

<script type="text/vja-tpl" id="wp-tpl-picture">
<div style="<%- base %>background:<%- bg %>;border:<%- border %>;display:flex;align-items:center;justify-content:center;color:#888;font-size:11px;<%- vis %>"><%- inner %></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-picture-img">
<img src="<%= src %>" style="max-width:100%;max-height:100%;object-fit:<%- objectFit %>">
</script>

<script type="text/vja-tpl" id="wp-tpl-qrcode">
<div class="qr-box" style="<%- base %>background:<%- bg %>;display:flex;align-items:center;justify-content:center;color:#888;font-size:24px;<%- vis %>"></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-markdown">
<div class="md-box" style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;border:<%- border %>;overflow:auto;padding:4px;box-sizing:border-box;<%- vis %>"></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-datepicker">
<input type="<%= itype %>" value="<%= value %>" <%- attrMin %> <%- attrMax %> style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;border:<%- border %>;padding:0 4px;pointer-events:none;<%- vis %>">
</script>

<script type="text/vja-tpl" id="wp-tpl-slider">
<div style="<%- base %>display:flex;align-items:center;<%- vis %>"><input type="range" min="<%= min %>" max="<%= max %>" value="<%= value %>" step="<%= step %>" style="width:100%;pointer-events:none;accent-color:#5b7bfa"></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-hscroll">
<div style="<%- base %>background:<%- bg %>;border:1px solid #999;border-radius:2px;display:flex;align-items:center;justify-content:space-between;padding:0 2px;<%- vis %>"><span style="font-size:9px">◀</span><div style="flex:1;height:50%;background:#999;margin:0 3px;border-radius:1px"></div><span style="font-size:9px">▶</span></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-vscroll">
<div style="<%- base %>background:<%- bg %>;border:1px solid #999;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 0;<%- vis %>"><span style="font-size:9px">▲</span><div style="width:50%;flex:1;background:#999;margin:3px 0;border-radius:1px"></div><span style="font-size:9px">▼</span></div>
</script>

<script type="text/vja-tpl" id="wp-tpl-textarea">
<textarea style="<%- base %>background:<%- bg %>;color:<%- fg %>;font-size:<%- fontSize %>px;font-family:<%- fontFamily %>;font-weight:<%- fontWeight %>;border:<%- border %>;resize:none;padding:4px;box-sizing:border-box;pointer-events:none;<%- vis %>" placeholder="<%= placeholder %>"><%= text %></textarea>
</script>
