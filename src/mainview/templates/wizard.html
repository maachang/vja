<!--
    templates/wizard.html
    vja-wizard.js（新規プロジェクト作成ウィザード）用テンプレート定義。
    詳細は templates/pinput.html のAIメモを参照。
-->
<script type="text/vja-tpl" id="wz-tpl-step-sep">
<span style="flex:1;height:1px;min-width:10px;background:<%= color %>"></span>
</script>

<script type="text/vja-tpl" id="wz-tpl-step-item">
<span style="display:flex;align-items:center;gap:4px">
<span style="<%= circleStyle %>"><%= circleText %></span>
<span style="<%= labelStyle %>"><%= label %></span>
</span><%- sep %>
</script>

<script type="text/vja-tpl" id="wz-tpl-step-indicator">
<div style="display:flex;align-items:center;gap:4px;margin-bottom:10px;flex-wrap:wrap"><%- items %></div>
</script>

<script type="text/vja-tpl" id="wz-tpl-form-size-opt">
<label style="display:flex;align-items:center;gap:8px;padding:6px 0">
<input type="radio" name="wiz-form-size" <%= checked %> <%- attr %>>
<span><b><%= label %></b> — <%= w %> × <%= h %>px<%= note %></span>
</label>
</script>

<script type="text/vja-tpl" id="wz-tpl-form-size-body">
<div class="mbody" style="gap:10px">
<%- stepIndicator %>
<div class="infobox">作成する画面のサイズを選んでください。現状のVJAのフォーム初期サイズ（640×420px）は「小」に相当します。項目数が多いアプリでは「中」「大」を選ぶと、1つの画面に項目を詰め込みすぎずに済みます。</div>
<%- optionsHtml %>
</div>
<div class="mfoot">
<button <%- attrCancel %>>キャンセル</button>
<button class="pri" <%- attrNext %>>次へ →</button>
</div>
</script>

<script type="text/vja-tpl" id="wz-tpl-overview-body">
<div class="mbody" style="gap:10px">
<%- stepIndicator %>
<div class="infobox">作りたいアプリの概要ややりたいことを、自由に日本語で書いてください（例:「日別の売上伝票を登録し、閉店後に締め処理で売上履歴へ集計・保存したい」）。この内容は後工程（画面構成の生成）の参考情報として使われます。データ項目・テーブルは次のステップ以降で「テーブル管理」から直接作成します。</div>
<textarea id="wiz-overview-text" class="pv-textarea" style="height:160px;font-size:13px" placeholder="アプリの概要ややりたいことを自由に書いてください"><%= overview %></textarea>
</div>
<div class="mfoot">
<button <%- attrCancel %>>キャンセル</button>
<button <%- attrBack %>>← 戻る</button>
<button class="pri" <%- attrNext %>>次へ →</button>
</div>
</script>

<script type="text/vja-tpl" id="wz-tpl-sysmodel-item">
<div class="tb-btn" style="text-align:left;padding:8px 10px;width:100%;cursor:pointer" <%- attrSelect %>>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
<div><b><%= title %></b><% if (example) { %><span style="font-size:11px;color:var(--text3);margin-left:8px">例: <%= example %></span><% } %></div>
<% if (good) { %><span style="font-size:11px;color:var(--text3);white-space:nowrap" <%- attrToggle %>><%= toggleLabel %></span><% } %>
</div>
<% if (good && expanded) { %><div style="font-size:11px;margin-top:6px;padding-top:4px;border-top:1px solid var(--border)"><%= good %></div><% } %>
</div>
</script>

<script type="text/vja-tpl" id="wz-tpl-sysmodel-body">
<div class="mbody" style="gap:10px">
<%- stepIndicator %>
<div class="infobox">このアプリの構造にもっとも近いものを選んでください。テーブル構成・画面構成の骨格として後工程のAI生成に活用されます（迷ったら「わからない/スキップ」でも構いません）。</div>
<div style="display:flex;flex-direction:column;gap:8px"><%- itemsHtml %></div>
</div>
<div class="mfoot">
<button <%- attrCancel %>>キャンセル</button>
<button <%- attrBack %>>← 戻る</button>
<button <%- attrSkip %>>わからない/スキップ →</button>
</div>
</script>

<script type="text/vja-tpl" id="wz-tpl-tables-nav-btns">
<span style="display:flex;gap:6px;align-items:center">
<span style="font-size:11px;color:var(--text3);margin-right:4px">🧙 ウィザード（テーブル管理）</span>
<button style="font-size:11px;padding:4px 10px" <%- attrBack %>>← 戻る</button>
<button class="pri" style="font-size:11px;padding:4px 10px" <%- attrNext %>>次へ →</button>
</span>
</script>

<script type="text/vja-tpl" id="wz-tpl-form-review-row">
<div class="rp-tbl-row"><div class="rp-tbl-header">
<span class="rp-tbl-name"><%= title %></span>
<span class="rp-tbl-desc"><%= description %></span>
</div></div>
</script>

<script type="text/vja-tpl" id="wz-tpl-form-review-body">
<div class="mbody" style="gap:10px">
<%- stepIndicator %>
<div class="infobox">以下の画面を作成します。よければ「生成開始」を押してください。</div>
<div><b>作成するフォーム</b></div>
<%- formsHtml %>
</div>
<div class="mfoot">
<button <%- attrCancel %>>キャンセル</button>
<button <%- attrBack %>>← 戻る</button>
<button class="pri" <%- attrGenerate %>>生成開始</button>
</div>
</script>

<script type="text/vja-tpl" id="wz-tpl-resume-body">
<div class="mbody" style="gap:10px">
<div class="infobox">前回、プロジェクト作成ウィザードが完了する前に中断されたようです。続きから再開しますか？</div>
</div>
<div class="mfoot">
<button <%- attrDiscard %>>破棄する</button>
<button class="pri" <%- attrResume %>>続きから再開</button>
</div>
</script>
