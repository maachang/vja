<!--
    templates/yaml-editor.html
    vja-yaml-editor.js のYAML/JSエディタ関連モーダル・UI部品用テンプレート定義。
    詳細は templates/pinput.html のAIメモを参照。
-->
<script type="text/vja-tpl" id="ye-tpl-completion-item">
<div class="editor-completion-item <%= sel %>" <%- attr %>><%= name %></div>
</script>

<script type="text/vja-tpl" id="ye-tpl-api-ref-cat">
<div class="api-ref-cat" data-label="<%= label %>" <%- attr %>><%= label %></div>
</script>

<script type="text/vja-tpl" id="ye-tpl-api-ref-body">
<div class="mbody" style="flex:1;min-height:0;overflow:hidden;padding:0;flex-direction:row;gap:0">
<div id="api-ref-nav" style="width:260px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);padding:6px 0;background:var(--bg2);display:flex;flex-direction:column;gap:1px">
<%- navHtml %>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:8px;overflow:hidden">
<input id="api-ref-search" placeholder="🔍 検索..." <%- attrSearch %>
style="height:30px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:13px;padding:0 10px;outline:none;flex-shrink:0;width:100%;box-sizing:border-box">
<div id="api-ref-body" style="flex:1;overflow:auto;font-size:18px;line-height:1.7;font-family:monospace;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:10px;white-space:pre-wrap;word-break:break-word;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text"><%- bodyHtml %></div>
</div>
</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-api-ref-line">
<span style="<%= style %>"><%- highlighted %></span>
</script>

<script type="text/vja-tpl" id="ye-tpl-mock-target-fixed">
<div class="pv-sel-btn" id="<%= id %>" style="opacity:0.5;cursor:default" onmousedown="event.stopPropagation()"><span>*</span></div>
</script>

<script type="text/vja-tpl" id="ye-tpl-validation-retry-btn">
<button class="yaml-ai-btn" <%- attr %>>🤖 もう一度AIに修正を依頼</button>
</script>

<script type="text/vja-tpl" id="ye-tpl-validation-ok-banner">
<div style="font-weight:bold;margin-bottom:8px">✅ 検証OKになりました（未知のAPI・構文エラーは検出されていません）</div>
<%- retryBtnHtml %>
<button class="yaml-ai-btn" <%- attrDismiss %>>閉じる</button>
</script>

<script type="text/vja-tpl" id="ye-tpl-validation-detail-btn">
<button class="yaml-ai-btn" <%- attr %>>🔍 全<%= count %>件を別ウィンドウで見る</button>
</script>

<script type="text/vja-tpl" id="ye-tpl-validation-ng-banner">
<div style="font-weight:bold;margin-bottom:4px;flex-shrink:0">⚠ 生成コードに問題の可能性があります（自動修正後も検出、<%= count %>件）<%- showDetailBtn %></div>
<div style="white-space:pre-line;margin-bottom:8px;overflow-y:auto;flex:1;min-height:0"><%- itemsHtml %></div>
<div style="flex-shrink:0">
<%- retryBtnHtml %>
<button class="yaml-ai-btn" <%- attrDismiss %>>このまま閉じる</button>
</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-validation-detail-body">
<div class="mbody" style="display:flex;flex-direction:column;gap:8px">
<div style="white-space:pre-line;max-height:60vh;overflow-y:auto;font-size:13px"><%- itemsHtml %></div>
</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-layout-card">
<div class="form-layout-card <%= active %>" data-pattern-id="<%= id %>" style="border:2px solid <%= borderColor %>;border-radius:6px;padding:8px;cursor:pointer;width:220px" <%- attr %>>
<%- inner %>
<div style="margin-top:6px;font-size:13px;text-align:center"><%= label %></div>
</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-layout-picker">
<div style="display:flex;flex-wrap:wrap;gap:14px"><%- cards %></div>
<div style="margin-top:10px;font-size:11px;color:var(--text3)">選択したレイアウトイメージは、YAMLには書き込まれず、「🤖 画面反映」実行時にAIへの補足指示として渡されます（もう一度クリックすると選択解除できます）。</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-formdesign-ai-bar">
<div style="display:flex;gap:6px;align-items:center;width:100%">
<button class="modal-btn" style="font-size:12px;padding:4px 10px;white-space:nowrap" onclick="openFormDesignTemplateModal()">📋 テンプレート選択…</button>
<input id="fd-prompt-in" placeholder="AIへの補足指示（任意）" style="flex:1">
<button class="yaml-ai-btn" id="fd-gen-yaml-btn" title="依頼文章から画面デザインYAMLを作成します" <%- attrYaml %>>✨ YAMLドラフト生成</button>
<button class="yaml-ai-btn" id="fd-gen-btn" <%- attrGen %>>🤖 画面反映</button>
</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-model-empty">
<div class="pv-sel-opt">（ルーターモードONで更新）</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-model-opt">
<div class="pv-sel-opt <%= active %>" <%- attr %>><%= label %></div>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-tr">
<tr class="rp-insert" data-insert="<%= insert %>"><td class="<%= cls1 %>"><%= col1 %></td><td class="<%= cls2 %>"><%= col2 %></td><td class="<%= cls3 %>"><%= col3 %></td></tr>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-expand-btn">
<button class="rp-tbl-expand" onmousedown="event.stopPropagation();yamlToggleTblCols(this)">▶</button>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-row-wrap">
<div class="rp-tbl-row"><div class="rp-tbl-header" style="<%= headerStyle %>"><%- headerInner %><%- expandBtn %></div><%- cols %></div>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-cols">
<div class="rp-tbl-cols"><table><%- rows %></table></div>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-const-section">
<table class="rp-table"><%- rows %></table>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-const-row">
<tr class="rp-insert" data-insert="<%= n %>"><td class="rp-name-col"><%= n %></td><td class="rp-val-col"><%= v %></td><td class="rp-tag-col"><%= tag %></td></tr>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-form-header-inner">
<span class="rp-tbl-name rp-insert" data-insert="<%= ft %>" style="<%= nameStyle %>"><%= star %><%= ft %></span>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-widget-header-inner">
<span class="rp-tbl-name rp-insert" data-insert="<%= n %>"><%= n %></span><span class="rp-tbl-desc"><%= tag %></span><%- descSpan %>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-desc-span">
<span class="rp-tbl-desc"><%= desc %></span>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-table-header-inner">
<%- toggleHtml %><span class="rp-tbl-name rp-insert" data-insert="<%= tn %>"><%= tn %></span>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-table-toggle-wrap">
<div style="width:52px;flex-shrink:0;margin-right:6px"><%- sel %></div>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-validation-header-inner">
<span class="rp-tbl-name"><%= vn %></span>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-validation-tr">
<tr><td class="col-name"><%= name %></td><td class="col-type"><%= type %></td><td class="col-flag"><%= flag %></td></tr>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-widgettag-header-inner">
<span class="rp-tbl-name rp-insert" data-insert="<%= tn %>"><%= tn %></span><span class="rp-tbl-desc"><%= label %></span>
</script>

<script type="text/vja-tpl" id="ye-tpl-rp-widgettag-note-tr">
<tr><td colspan="3" style="white-space:normal;color:var(--text3)"><%= note %></td></tr>
</script>

<script type="text/vja-tpl" id="ye-tpl-mockcheck-section">
<div style="padding:6px 10px;display:flex;flex-direction:column;gap:6px">
<div style="font-size:11px;color:var(--text2)">AI生成直後の自動モック実行検証（「🧪 モック実行」の手動実行には影響しません）</div>
<%- sel %>
</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-learned-row">
<div class="rp-learned-row" style="padding:6px 10px;border-bottom:1px solid var(--border);font-size:11px">
<div style="margin-bottom:4px;color:var(--text2)"><%= summary %></div>
<div style="display:flex;gap:6px">
<button class="yaml-ai-btn" style="font-size:11px;padding:2px 6px" <%= disabled %> <%- attrPin %>><%= pinLabel %></button>
<button class="yaml-ai-btn" style="font-size:11px;padding:2px 6px" <%- attrDel %>>🗑 削除</button>
</div>
</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-apiopt-locked">
<div style="padding:4px 10px;font-size:12px;color:var(--text3)">🔒 <%= label %>：このイベントでは常時有効です（OFF不可）</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-apiopt-row">
<div style="display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12px">
<div style="width:64px;flex-shrink:0"><%- sel %></div>
<span><%= label %></span>
</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-apiopt-dbnote">
<div style="padding:6px 10px;font-size:11px;color:var(--text3)">🗄 vja.db.*: YAMLの「利用テーブル:」に記載があれば自動的に利用可能になります（チェック不要）</div>
</script>

<script type="text/vja-tpl" id="ye-tpl-mock-row">
<div class="mock-editor-row" data-idx="<%= idx %>" data-type="<%= type %>" style="display:flex;gap:6px;margin-bottom:6px;align-items:flex-start">
<div style="width:120px;flex-shrink:0"><%- typeSel %></div>
<div class="mock-target-wrap" id="mock-target-wrap-<%= idx %>" style="width:140px;flex-shrink:0"><%- targetCell %></div>
<textarea class="mock-json-ta pv-input" style="flex:1;height:50px;font-family:monospace;font-size:12px;resize:vertical" placeholder='JSON（例: "検索したい文字" / {"type":"rowClick","row":2}）'><%= json %></textarea>
<button class="yaml-ai-btn" style="padding:4px 8px;flex-shrink:0" <%- attrRemove %>>🗑</button>
</div>
</script>
